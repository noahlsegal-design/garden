<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A14" media="(prefers-color-scheme: dark)">
<title>Noah's Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/styles.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<header class="top">
  <div class="titlebar">
    <h1>Noah's Garden</h1>
    <div class="topbtns">
      <button class="ghostbtn primary" id="tasksBtn" aria-haspopup="dialog">This week<span class="count" id="tasksCount" hidden></span></button>
      <button class="ghostbtn" id="listBtn" aria-haspopup="dialog">All plants</button>
    </div>
  </div>
  <nav class="months" id="months" aria-label="Month"></nav>
</header>

<main class="stage" id="stage">
  <canvas id="yard" tabindex="0" aria-label="3D model of the garden. Drag to move around, pinch or scroll to zoom, and use the arrow keys to slide the view. The All plants button lists every plant."></canvas>
  <div class="mapbar">
    <div class="mapnotes">
      <span class="hint" id="hintText"></span>
    </div>
    <div class="mapbtns">
      <button type="button" class="mapbtn" id="viewsBtn" aria-expanded="false" aria-controls="viewsMenu">Views</button>
      <button type="button" class="mapbtn" id="resetBtn">Reset view</button>
    </div>
  </div>
  <div class="viewsmenu" id="viewsMenu" role="group" aria-label="Views" hidden></div>
  <div class="highlightchip" id="highlightChip" hidden></div>
  <div class="mapctl" role="group" aria-label="Move the view">
    <button type="button" id="zoomInBtn" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="zoomOutBtn" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button type="button" id="turnLeftBtn" class="gap" aria-label="Turn left" title="Turn left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5A8 8 0 1 1 5 15"/><path d="M4 4.5v5h5"/></svg></button>
    <button type="button" id="turnRightBtn" aria-label="Turn right" title="Turn right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 9.5A8 8 0 1 0 19 15"/><path d="M20 4.5v5h-5"/></svg></button>
  </div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle" hidden></section>
  <div class="overlay" id="status" role="status">Loading your garden…</div>
</main>

<section class="listpanel" id="listPanel" role="dialog" aria-modal="true" aria-labelledby="listTitle" hidden></section>
<section class="listpanel taskpanel" id="tasksPanel" role="dialog" aria-modal="true" aria-labelledby="tasksTitle" hidden></section>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" hidden></div>

<script type="module" src="app/main.js"></script>
</body>
</html>
