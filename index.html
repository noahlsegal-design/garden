<!-- The ?v=… on each app file is the app's version, so after a publish browsers fetch all the new files together
     instead of mixing old and new. Don't edit it by hand: "node stamp-version.mjs" updates it. -->
<link rel="stylesheet" href="app/styles.css?v=9457f484ae">
<script>
// Light or Dark from Settings, set before the page draws so it doesn't flash the other look first (app/prefs.js).
try {
  const t = JSON.parse(localStorage.getItem("garden.prefs"))?.theme;
  if (t === "light" || t === "dark") {
    document.documentElement.dataset.theme = t;
    for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.content = t === "dark" ? "#131A14" : "#EEF2E6";
  }
} catch {}
</script>

<body>
<!-- The live 3D yard fills the whole screen, behind everything else. Its own controls (views, zoom, bloom
     timeline, Edit) show in the Yard view; the plant card opens over any screen. -->
<main class="stage" id="stage">
  <canvas id="yard" tabindex="0" aria-label="3D model of the garden. Drag to move around, pinch or scroll to zoom, and use the arrow keys to slide the view. The Plants tab lists every plant."></canvas>
  <!-- The Yard view's top bar: back to Today, the month the yard shows, and Views (with Edit under it). -->
  <div class="mapbar">
    <button type="button" class="yardback glass onsky" id="yardBack" aria-label="Back to Today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <div class="monthswitch glass onsky" role="group" aria-label="Month the yard shows">
      <button type="button" id="monthPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6L8.5 12l6 6"/></svg></button>
      <button type="button" class="monthname" id="monthName" aria-live="polite"></button>
      <button type="button" id="monthNext" aria-label="Next month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
    </div>
    <div class="mapbtns">
      <button type="button" class="mapbtn glass onsky" id="viewsBtn" aria-expanded="false" aria-controls="viewsMenu">Views</button>
      <button type="button" class="mapbtn glass onsky" id="editBtn" aria-pressed="false" aria-controls="editBar" hidden>Edit</button>
    </div>
  </div>
  <p class="hint glass onsky" id="hintText" hidden></p>
  <!-- Labels over plants with jobs this week, and the card that slides up for a plant (app/yardview.js). -->
  <div class="ylabels" id="yardLabels" hidden></div>
  <div class="viewsmenu" id="viewsMenu" role="group" aria-label="Views" hidden></div>
  <div class="highlightchip" id="highlightChip" hidden></div>
  <div class="mapctl" role="group" aria-label="Move the view">
    <button type="button" class="glass onsky" id="zoomInBtn" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" class="glass onsky" id="zoomOutBtn" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button type="button" id="turnLeftBtn" class="gap glass onsky" aria-label="Turn left" title="Turn left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5A8 8 0 1 1 5 15"/><path d="M4 4.5v5h5"/></svg></button>
    <button type="button" class="glass onsky" id="turnRightBtn" aria-label="Turn right" title="Turn right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 9.5A8 8 0 1 0 19 15"/><path d="M20 4.5v5h-5"/></svg></button>
  </div>
  <div class="bloombar glass onsky" id="bloomBar" role="group" aria-label="Bloom timeline"></div>
  <div class="edittray" id="editBar" role="group" aria-label="Edit the yard" hidden></div>
  <section class="peek glass" id="peek" aria-label="Plant" hidden></section>
  <div class="overlay" id="status" role="status">Loading your garden…</div>
</main>

<!-- On Calendar and Plants the yard shows through, blurred. -->
<div class="veil" id="veil" aria-hidden="true"></div>

<!-- Today: over the live yard. The count of jobs left at the top, and the jobs, the other person's latest
     check-off and the newest photos at the bottom. Tapping the yard between them opens the Yard view. -->
<section class="screen today" id="todayScreen" aria-labelledby="todayCount">
  <div class="todaypanels" id="todayPanels">
    <header class="todayhead">
      <div class="todaytop">
        <p class="todaydate" id="todayDate"></p>
        <button type="button" class="gearbtn glass" id="settingsBtn" aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      </div>
      <button type="button" class="todaycount" id="tasksBtn" aria-haspopup="dialog"><span class="bignum" id="todayCount"></span><span class="numlabel" id="todayCountLabel"></span></button>
      <p class="todaymonth glass" id="todayMonth" hidden></p>
    </header>
    <div class="todaybottom">
      <div id="todayJobs"></div>
      <div class="partnerline glass" id="todayPartner" hidden></div>
      <div class="photospanel glass" id="todayPhotos"></div>
    </div>
  </div>
</section>

<!-- The Calendar: Year, Month and Week (app/calendar.js), over the blurred yard. -->
<section class="screen calendar" id="calendarScreen" aria-labelledby="calendarTitle" hidden></section>

<section class="screen listpanel" id="listPanel" aria-labelledby="listTitle" hidden></section>

<!-- The tab bar and the search button float at the bottom of every screen. -->
<div class="tabdock">
  <nav class="tabbar glass" id="tabBar" aria-label="Screens">
    <button type="button" class="tab" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg><span>Today</span></button>
    <button type="button" class="tab" data-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
    <button type="button" class="tab" data-tab="plants"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-5 3-8 8-8 0 5-3 8-8 8z"/><path d="M12 15c0-4-2.5-6.5-7-6.5 0 4 2.5 6.5 7 6.5z"/></svg><span>Plants</span></button>
  </nav>
  <button type="button" class="searchbtn glass" id="searchBtn" aria-label="Search plants"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
</div>

<!-- The plant card: a sheet from the bottom on phones (over the tab bar), a side panel on wide screens. -->
<section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle" hidden></section>
<section class="listpanel taskpanel" id="tasksPanel" role="dialog" aria-modal="true" aria-labelledby="tasksTitle" hidden></section>
<section class="listpanel" id="checksPanel" role="dialog" aria-modal="true" aria-labelledby="checksTitle" hidden></section>
<section class="listpanel setpanel" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden></section>
<section class="listpanel" id="photosPanel" role="dialog" aria-modal="true" aria-labelledby="photosTitle" hidden></section>
<section class="listpanel" id="savePanel" role="dialog" aria-modal="true" aria-labelledby="saveTitle" hidden></section>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" hidden></div>

<script type="module">
// Starts the app. If its files don't fit together (a copy of this page kept from just before a publish), reload once,
// which fetches the new page and with it the new files. A second failure in a row is shown instead.
const RETRIED = "garden-reloaded";
let retried = false;
try { retried = sessionStorage.getItem(RETRIED) === "1"; sessionStorage.removeItem(RETRIED); } catch {}
import("./app/main.js").catch((err) => {
  console.error(err);
  if (!retried) {
    try { sessionStorage.setItem(RETRIED, "1"); location.reload(); return; } catch {} // no reload without the flag, so it can't loop
  }
  const status = document.getElementById("status");
  status.hidden = false;
  status.innerHTML = "<div><p><b>The garden couldn't start.</b></p><p>Close the app and open it again, or reload the page.</p><pre></pre></div>";
  status.querySelector("pre").textContent = String(err?.message || err);
});
</script>
</body>
</html>
